<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{--wine:#711f2b;--gold:#b48b45;--cream:#f4efe5;--ink:#33251d;--line:#ded3c1;--white:#fff;--green:#3e8a59}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:82px;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px}.logo{width:49px;height:49px;border-radius:14px;background:var(--wine);color:#e8c678;display:grid;place-items:center;font:700 25px Georgia}.kicker{font-size:11px;letter-spacing:.13em;color:#8d7a63;font-weight:700}.top h1{margin:4px 0 0;font:700 24px Georgia;color:var(--wine)}.top h1 span{font:400 15px Arial;color:#8c7964;border-left:1px solid var(--line);padding-left:10px;margin-left:8px}.state{margin-left:auto;color:#766b5e;font-size:13px;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.courses{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 30px}.course{border:0;background:transparent;padding:0 22px;color:#766a5e}.course b{font:400 10px Georgia;color:var(--gold);margin-right:9px}.course.active{color:var(--wine);font-weight:700;background:#faf7f1;border-bottom:3px solid var(--wine)}.add{margin:auto 0 auto auto;border:0;border-radius:11px;background:var(--wine);color:#fff;padding:11px 16px;font-weight:700}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 152px)}aside{background:#ede6d9;border-right:1px solid var(--line);padding:24px 13px}.aside-title{padding:0 10px 13px;font-size:11px;letter-spacing:.12em;color:#8b7964;font-weight:800}.cate{width:100%;border:0;background:transparent;border-radius:11px;display:flex;align-items:center;gap:10px;padding:9px;text-align:left}.cate:hover,.cate.active{background:#fff;box-shadow:0 2px 10px #4c2f1710;color:var(--wine)}.avatar{width:32px;height:32px;border-radius:50%;background:#dac9ac;display:grid;place-items:center;font:700 11px Georgia}.cate.active .avatar{background:var(--wine);color:#fff}.cate small{display:block;color:#938270;margin-top:2px}.main{min-width:0;padding:28px 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}.head p{margin:0;color:var(--gold);font-size:11px;letter-spacing:.14em;font-weight:800}.head h2{margin:3px 0;font:700 30px Georgia}.head span{color:#8c7b68;font-size:13px}.tools{display:flex;gap:9px}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;width:260px}.secondary{border:1px solid var(--ink);background:#fff;border-radius:9px;padding:10px 13px}.tablebox{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto;box-shadow:0 8px 30px #4f2b1608;min-height:310px}table{border-collapse:collapse;width:100%;min-width:1050px}th{background:var(--wine);color:#fff;padding:14px 11px;text-align:left;font-size:10px;letter-spacing:.08em}td{border-bottom:1px solid #eee7dc;border-right:1px solid #f3eee6;padding:5px 7px}td input{width:100%;min-width:100px;border:1px solid transparent;border-radius:6px;background:transparent;padding:8px}td input:focus{outline:0;border-color:#d6bf96;background:#fffaf0}.name{border:0;background:transparent;text-align:left;min-width:220px}.name b,.name small{display:block}.name small{color:#968675;margin-top:3px}.icon{border:0;background:transparent;color:var(--wine);padding:7px}.empty{text-align:center;color:#8b7964;padding:75px 20px}.empty b,.empty span{display:block}.empty b{font:700 17px Georgia;margin-bottom:5px}.loading{display:grid;place-items:center;height:260px;color:#8b7964}.modal{position:fixed;inset:0;background:#26170fb3;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.panel{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:25px;box-shadow:0 25px 80px #0004}.panel h3{margin:3px 0 20px;font:700 26px Georgia;color:var(--wine)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px;background:#fff}.field textarea{min-height:76px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.cancel,.save{border-radius:9px;padding:10px 16px;font-weight:700}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:var(--wine);color:#fff}.error{background:#fff0f1;color:#8d1f2d;border:1px solid #e5bbc1;padding:12px;border-radius:9px;margin-bottom:15px;display:none}.print{display:none}.ticket{border:2px solid var(--wine);border-radius:15px;padding:18px;margin-top:8px}.ticket h3{font:700 19px Georgia;color:var(--wine);margin:3px 0 14px}.ticket dl{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px}.ticket dl div{border-bottom:1px solid var(--line);padding:5px}.ticket dt{font-size:9px;text-transform:uppercase;color:#8a7966;font-weight:700}.ticket dd{margin:3px 0;font-weight:700}.ticket footer{margin-top:15px;font-size:11px}@media(max-width:800px){.top{padding:0 15px}.kicker{display:none}.state{font-size:0}.courses{padding:0 6px;overflow:auto}.course{padding:0 13px;font-size:11px}.add{position:fixed;right:15px;bottom:15px;z-index:5}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:9px;border-right:0}.aside-title{display:none}.cate{min-width:135px}.main{padding:18px 12px}.head{align-items:flex-start;flex-direction:column;gap:14px}.tools{width:100%;flex-wrap:wrap}.search{flex:1}.grid{grid-template-columns:1fr}}@media print{body>*{display:none!important}.print{display:grid!important;grid-template-rows:1fr 1fr;width:7.5in;height:10in;margin:.25in auto}.print>div{padding:.18in;border-bottom:1px dashed #777}}
    /* Imagen institucional: Señor de la Misericordia */
    body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#f8f3ea,#eee1cc)}
    .top{height:86px;background:linear-gradient(110deg,#4d111d,#741f2d 58%,#8b3340);border-bottom:3px solid #bd9145;box-shadow:0 5px 20px #4d111d28}
    .logo{width:54px;height:54px;border:1px solid #e9cc8b;background:linear-gradient(145deg,#8b2d3b,#58131f);color:#f2d691;box-shadow:0 6px 18px #26070d55}
    .top .kicker{color:#e3c993}.top h1{color:#fff}.top h1 span{color:#eadfcf;border-color:#ffffff55}
    .state{color:#fff;background:#ffffff15;border:1px solid #ffffff25;border-radius:999px;padding:9px 13px}
    .dot{width:9px;height:9px;box-shadow:0 0 0 4px #ffffff16}
    .courses{box-shadow:0 4px 16px #5c31110b}.course.active{background:#fffaf2;border-bottom-color:#bd9145}
    aside{background:linear-gradient(180deg,#ede2d0,#f4ecdf)}.tablebox{box-shadow:0 16px 45px #4f2b1612}
    th{background:linear-gradient(90deg,#5a1521,#7b2633)}.add,.save{background:linear-gradient(135deg,#7a2432,#57131f);box-shadow:0 5px 14px #64192730}
    .qr{width:58px;height:58px;border:5px solid #fff;border-radius:8px;box-shadow:0 2px 10px #4d111d22}.codeText{display:block;font-size:10px;color:#756554;max-width:110px;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.04em}.badge.COMPLETO{background:#e2f4e9;color:#17643f}.badge.HERMANOS{background:#e6edff;color:#315494}.badge.PENDIENTE{background:#fff0cf;color:#8a5a00}.badge.EXENTO{background:#eee7f8;color:#684492}.dashboard{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:20px}.metric{border:1px solid var(--line);border-radius:15px;background:#fff;padding:18px;text-align:left;box-shadow:0 8px 24px #4d111d0c}.metric strong{display:block;font:700 31px Georgia;color:var(--wine)}.metric span{color:#806f5d;font-size:12px}.metric:hover{transform:translateY(-2px);border-color:var(--gold)}.docs{grid-column:1/-1;border-top:1px solid var(--line);margin-top:8px;padding-top:18px}.docs h4{margin:0 0 12px;color:var(--wine);font:700 18px Georgia}.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.docitem{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbf8f3}.docitem label{font-size:12px;font-weight:800}.docitem input{width:100%;margin-top:7px}.doclist{margin-top:12px;display:grid;gap:7px}.docrow{display:flex;align-items:center;justify-content:space-between;background:#f5efe5;border-radius:9px;padding:9px 11px;font-size:12px}.viewerPanel{width:min(1000px,96vw);height:90vh;padding:14px}.viewerPanel iframe{width:100%;height:calc(100% - 48px);border:0;border-radius:10px;background:#eee}.viewerHead{display:flex;align-items:center;justify-content:space-between;height:40px}.viewerHead h3{font-size:18px;margin:0}.readonly{background:#eee9e1!important;color:#6f655b}.dashboardMode{grid-template-columns:1fr}.dashboardMode aside{display:none}@media(max-width:800px){.dashboard{grid-template-columns:1fr 1fr}.docgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="logo">M</div><div><div class="kicker">MISIÓN PARROQUIAL · EL SEÑOR DE LA MISERICORDIA</div><h1>CATEKIDS <span>Registros</span></h1></div><div class="state"><i class="dot"></i><span id="state">Conectando con los libros…</span></div></header>
  <nav class="courses" id="courses"></nav>
  <div class="layout"><aside><div class="aside-title">CATEQUISTAS</div><div id="catechists"></div></aside><section class="main"><div class="head"><div><p id="courseLabel"></p><h2 id="cateLabel">Todos</h2><span id="count">0 catequizandos</span></div><div class="tools"><input class="search" id="search" placeholder="Buscar nombre o código"><button class="secondary" onclick="loadCourse()">↻ Actualizar</button></div></div><div class="tablebox" id="table"></div></section></div>
  <div class="modal" id="modal"><div class="panel"><div class="error" id="error"></div><div class="kicker" id="formCourse"></div><h3 id="formTitle">Nueva inscripción</h3><div class="grid">
    <label class="field">Nombre(s)<input id="firstName"></label><label class="field">Apellido paterno<input id="paternal"></label>
    <label class="field">Apellido materno<input id="maternal"></label><label class="field">Código QR único<input id="code"></label>
    <label class="field">Catequista<select id="formCate"></select></label><label class="field">Fecha de nacimiento<input id="birthDate" type="date"></label>
    <label class="field">Tutor<input id="tutor"></label><label class="field">WhatsApp<input id="phone" inputmode="tel"></label>
    <label class="field">Pago<input id="payment" type="number" min="0"></label><label class="field">Estado del pago<select id="paymentStatus"><option>COMPLETO</option><option>HERMANOS</option><option>PENDIENTE</option><option>EXENTO</option></select></label>
    <label class="field">Observaciones<textarea id="notes"></textarea></label>
    <section class="docs" id="documents"><h4>Expediente digital del alumno</h4><div class="docgrid">
      <div class="docitem"><label>Acta de nacimiento<input id="docActa" type="file" accept="application/pdf,image/*"></label></div>
      <div class="docitem"><label>Boleta de bautizo<input id="docBautizo" type="file" accept="application/pdf,image/*"></label></div>
      <div class="docitem"><label>Boleta de confirmación<input id="docConfirmacion" type="file" accept="application/pdf,image/*"></label></div>
      <div class="docitem"><label>Boleta de comunión<input id="docComunion" type="file" accept="application/pdf,image/*"></label></div>
      <div class="docitem"><label>INE del tutor<input id="docIne" type="file" accept="application/pdf,image/*"></label></div>
    </div><div class="doclist" id="docList"></div></section>
  </div><div class="actions"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="save" id="save" onclick="saveForm()">Guardar inscripción</button></div></div></div>
  <div class="modal" id="viewer"><div class="panel viewerPanel"><div class="viewerHead"><h3 id="viewerTitle">Documento</h3><button class="cancel" onclick="closeViewer()">Cerrar</button></div><iframe id="viewerFrame" title="Visor de documento"></iframe></div></div>
  <div class="print" id="print"></div>
  <script>
    const COURSES=['INICIACIÓN','CONFIRMACIÓN','COMUNIÓN','PERSEVERANTES'];
    const API_URL='https://script.google.com/macros/s/AKfycby2VG4YFAWUOnCueZYAfq0aAq4VSYjElF6Z_BKr_9r4oKyZqIi06Dywd7v6w4JHhC8/exec';
    const API_TOKEN='CKR_2026_MISERICORDIA_7f4a91';
    const DOCS=[['docActa','ACTA_NACIMIENTO','Acta de nacimiento'],['docBautizo','BOLETA_BAUTIZO','Boleta de bautizo'],['docConfirmacion','BOLETA_CONFIRMACION','Boleta de confirmación'],['docComunion','BOLETA_COMUNION','Boleta de comunión'],['docIne','INE_TUTOR','INE del tutor']];
    let config={},students=[],course=COURSES[0],cate='Todos',editing=null,timer=null,mode='course',dashboardFilter='TODOS';
    function call(name,...args){
      if(typeof google!=='undefined'&&google.script&&google.script.run){
        return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
      }
      const requests={getConfig:{action:'config'},getStudents:{action:'list',course:args[0]},saveStudent:{action:'upsert',student:args[0]},getStudentFiles:{action:'files',code:args[0]},uploadStudentDocument:{action:'uploadStudentDocument',payload:args[0]}};
      const request=requests[name];
      if(!request)return Promise.reject(new Error('Operación no disponible: '+name));
      return fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...request,token:API_TOKEN})})
        .then(r=>{if(!r.ok)throw new Error('El servidor respondió '+r.status);return r.json()})
        .then(data=>{if(!data.ok)throw new Error(data.error||'No fue posible completar la operación');if(name==='getConfig')return data.courses;if(name==='getStudents')return data.students;if(name==='saveStudent')return data.student;if(name==='getStudentFiles')return data.files;if(name==='uploadStudentDocument')return data.file;return data});
    }
    async function init(){try{config=await call('getConfig');drawCourses();await loadCourse()}catch(e){showFatal(e)}}
    function drawCourses(){const nav=document.getElementById('courses');nav.innerHTML=`<button class="course ${mode==='dashboard'?'active':''}" onclick="openDashboard()"><b>◎</b>DASHBOARD</button>`+COURSES.map((c,i)=>`<button class="course ${mode==='course'&&c===course?'active':''}" onclick="changeCourse('${c}')"><b>0${i+1}</b>${c}</button>`).join('')+`<button class="add" onclick="openModal()">＋ Nueva inscripción</button>`}
    async function changeCourse(c){mode='course';course=c;cate='Todos';document.querySelector('.layout').classList.remove('dashboardMode');drawCourses();await loadCourse()}
    async function loadCourse(){mode='course';setState('Actualizando desde Google Sheets…',false);document.getElementById('table').innerHTML='<div class="loading">Cargando registros…</div>';try{students=await call('getStudents',course);drawCates();drawTable();setState('Sincronizado con Google Sheets',true)}catch(e){showFatal(e)}}
    function drawCates(){const list=['Todos',...(config[course]||[])];document.getElementById('catechists').innerHTML=list.map((c,i)=>{const n=c==='Todos'?students.length:students.filter(s=>s.catechist===c).length;return `<button class="cate ${c===cate?'active':''}" onclick="selectCate('${esc(c)}')"><span class="avatar">${i?' '+esc(c).slice(0,2):'∑'}</span><span>${esc(c)}<small>${n} inscritos</small></span></button>`}).join('');document.getElementById('formCate').innerHTML=(config[course]||[]).map(c=>`<option>${esc(c)}</option>`).join('')}
    function selectCate(c){cate=c;drawCates();drawTable()}
    function filtered(){const q=document.getElementById('search').value.toLowerCase();return students.filter(s=>(cate==='Todos'||s.catechist===cate)&&(`${s.firstName} ${s.lastName} ${s.code}`.toLowerCase().includes(q)))}
    function drawTable(){const rows=filtered();document.getElementById('courseLabel').textContent=course;document.getElementById('cateLabel').textContent=cate;document.getElementById('count').textContent=`${rows.length} catequizandos`;if(!rows.length){document.getElementById('table').innerHTML='<div class="empty"><b>Aún no hay registros aquí</b><span>Agrega una inscripción o elige otro catequista.</span></div>';return}document.getElementById('table').innerHTML=`<table><thead><tr><th>#</th><th>QR único</th><th>Nombre completo</th><th>Fecha nac.</th><th>Tutor</th><th>WhatsApp</th><th>Estado</th><th>Ticket</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td><img class="qr" alt="QR ${attr(s.code)}" src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(s.code||s.id)}"><span class="codeText" title="${attr(s.code)}">${esc(s.code)}</span></td><td><button class="name" onclick="openModal('${attr(s.id)}')"><b>${esc(s.firstName)} ${esc(s.lastName)}</b><small>${esc(s.catechist)} · Abrir expediente</small></button></td><td><input type="date" value="${attr(s.birthDate)}" onchange="quick('${attr(s.id)}','birthDate',this.value)"></td><td><input value="${attr(s.tutor)}" onchange="quick('${attr(s.id)}','tutor',this.value)"></td><td><input value="${attr(s.phone)}" onchange="quick('${attr(s.id)}','phone',this.value)"></td><td><span class="badge ${attr(paymentState(s))}">${esc(paymentState(s))}</span></td><td><button class="icon" onclick="printTicket('${attr(s.id)}')">🖨️</button></td></tr>`).join('')}</tbody></table>`}
    async function quick(id,key,value){const s=students.find(x=>x.id===id);if(!s)return;s[key]=value;setState('Guardando cambio…',false);clearTimeout(timer);timer=setTimeout(async()=>{try{const saved=await call('saveStudent',s);Object.assign(s,saved);setState('Todos los cambios guardados',true)}catch(e){setState('Error al guardar',false);alert(e.message||e)}},500)}
    async function openModal(id){editing=id?students.find(x=>x.id===id):null;const studentCourse=editing?editing.course:course;document.getElementById('formCourse').textContent=studentCourse;document.getElementById('formTitle').textContent=editing?'Expediente individual':'Nueva inscripción';document.getElementById('formCate').innerHTML=(config[studentCourse]||[]).map(c=>`<option>${esc(c)}</option>`).join('');const s=editing||{course:studentCourse,catechist:(config[studentCourse]||[])[0],firstName:'',paternalLastName:'',maternalLastName:'',code:'',birthDate:'',tutor:'',phone:'',payment:0,paymentStatus:'PENDIENTE',notes:''};['firstName','code','birthDate','tutor','phone','payment','notes'].forEach(k=>document.getElementById(k).value=s[k]||'');document.getElementById('paternal').value=s.paternalLastName||'';document.getElementById('maternal').value=s.maternalLastName||'';document.getElementById('formCate').value=s.catechist||'';document.getElementById('paymentStatus').value=paymentState(s);const codeInput=document.getElementById('code');codeInput.readOnly=!!editing;codeInput.classList.toggle('readonly',!!editing);codeInput.title=editing?'El código QR es único y no se puede modificar':'';DOCS.forEach(d=>document.getElementById(d[0]).value='');document.getElementById('docList').innerHTML=editing?'<div class="loading">Consultando documentos…</div>':'<small>Guarda primero al alumno para crear su expediente.</small>';document.getElementById('error').style.display='none';document.getElementById('modal').classList.add('open');if(editing){try{drawDocuments(await call('getStudentFiles',editing.code))}catch(e){document.getElementById('docList').innerHTML='<small>No fue posible consultar los documentos.</small>'}}}
    function closeModal(){document.getElementById('modal').classList.remove('open');editing=null}
    async function saveForm(){const s=editing||{course};const studentCourse=editing?editing.course:course;Object.assign(s,{course:studentCourse,catechist:document.getElementById('formCate').value,firstName:v('firstName'),paternalLastName:v('paternal'),maternalLastName:v('maternal'),lastName:`${v('paternal')} ${v('maternal')}`.trim(),code:v('code'),birthDate:v('birthDate'),tutor:v('tutor'),phone:v('phone'),payment:Number(v('payment'))||0,paymentStatus:v('paymentStatus'),notes:v('notes')});if(!s.firstName||!s.paternalLastName||!s.catechist||!s.code){return formError('Completa nombre, apellido paterno, catequista y código QR.')}const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Guardando expediente…';try{const saved=await call('saveStudent',s);for(const [inputId,docType] of DOCS){const file=document.getElementById(inputId).files[0];if(!file)continue;if(file.size>10*1024*1024)throw new Error('Cada documento debe pesar menos de 10 MB.');await call('uploadStudentDocument',{code:saved.code||s.code,docType,name:file.name,mimeType:file.type,base64:await readFile(file)})}closeModal();if(mode==='dashboard')await openDashboard();else await loadCourse()}catch(e){formError(e.message||String(e))}finally{btn.disabled=false;btn.textContent='Guardar expediente'}}
    function drawDocuments(files){const labels=Object.fromEntries(DOCS.map(d=>[d[1],d[2]]));document.getElementById('docList').innerHTML=files.length?files.map(f=>`<div class="docrow"><span><b>${esc(labels[f.docType]||f.docType)}</b><br>${esc(f.name)}</span><button class="secondary" onclick="openViewer('${attr(f.previewUrl)}','${attr(labels[f.docType]||f.name)}')">Ver documento</button></div>`).join(''):'<small>Aún no hay documentos cargados para este alumno.</small>'}
    function openViewer(url,title){document.getElementById('viewerTitle').textContent=title;document.getElementById('viewerFrame').src=url;document.getElementById('viewer').classList.add('open')}
    function closeViewer(){document.getElementById('viewer').classList.remove('open');document.getElementById('viewerFrame').src='about:blank'}
    function paymentState(s){const v=String(s.paymentStatus||'').toUpperCase();if(v.includes('HERMAN'))return'HERMANOS';if(v.includes('EXENT'))return'EXENTO';if(v.includes('COMPLET')||v.includes('PAGAD'))return'COMPLETO';return Number(s.payment)>0?'COMPLETO':'PENDIENTE'}
    async function openDashboard(filter){mode='dashboard';dashboardFilter=filter||dashboardFilter;drawCourses();document.querySelector('.layout').classList.add('dashboardMode');document.getElementById('table').innerHTML='<div class="loading">Preparando dashboard de pagos…</div>';setState('Actualizando dashboard…',false);try{students=await call('getStudents','');drawDashboard();setState('Dashboard actualizado',true)}catch(e){showFatal(e)}}
    function drawDashboard(){const states=['COMPLETO','HERMANOS','PENDIENTE','EXENTO'];const counts=Object.fromEntries(states.map(x=>[x,students.filter(s=>paymentState(s)===x).length]));const rows=dashboardFilter==='TODOS'?students:students.filter(s=>paymentState(s)===dashboardFilter);document.getElementById('courseLabel').textContent='CONTROL GENERAL';document.getElementById('cateLabel').textContent='Dashboard de pagos';document.getElementById('count').textContent=`${students.length} alumnos registrados`;document.getElementById('catechists').innerHTML='';document.getElementById('table').innerHTML=`<div style="padding:18px"><div class="dashboard">${states.map(x=>`<button class="metric" onclick="dashboardFilter='${x}';drawDashboard()"><strong>${counts[x]}</strong><span>${x}</span></button>`).join('')}</div><div class="tools" style="margin-bottom:14px"><button class="secondary" onclick="dashboardFilter='TODOS';drawDashboard()">Mostrar todos</button><span class="badge ${dashboardFilter}">${dashboardFilter}</span></div><table><thead><tr><th>#</th><th>Alumno</th><th>Curso</th><th>Catequista</th><th>Pago</th><th>Estado</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i+1}</td><td><button class="name" onclick="openModal('${attr(s.id)}')"><b>${esc(s.firstName)} ${esc(s.lastName)}</b><small>${esc(s.code)} · Abrir expediente</small></button></td><td>${esc(s.course)}</td><td>${esc(s.catechist)}</td><td>$${Number(s.payment||0).toFixed(2)}</td><td><span class="badge ${paymentState(s)}">${paymentState(s)}</span></td></tr>`).join('')}</tbody></table></div>`}
    function printTicket(id){const s=students.find(x=>x.id===id);const one=`<div class="ticket"><div class="kicker">MISIÓN PARROQUIAL · EL SEÑOR DE LA MISERICORDIA</div><h3>Comprobante de inscripción CATEKIDS</h3><dl><div><dt>Folio</dt><dd>${esc(s.code)}</dd></div><div><dt>Catequizando</dt><dd>${esc(s.firstName)} ${esc(s.lastName)}</dd></div><div><dt>Curso</dt><dd>${esc(s.course)}</dd></div><div><dt>Catequista</dt><dd>${esc(s.catechist)}</dd></div><div><dt>Tutor</dt><dd>${esc(s.tutor)}</dd></div><div><dt>Pago recibido</dt><dd>$${Number(s.payment||0).toFixed(2)}</dd></div></dl><footer>Fecha: ${new Date().toLocaleDateString('es-MX')} · Firma: ____________________</footer></div>`;document.getElementById('print').innerHTML=`<div><small>ARCHIVO CATEKIDS</small>${one}</div><div><small>COPIA PARA EL TUTOR</small>${one}</div>`;window.print()}
    document.getElementById('search').addEventListener('input',()=>mode==='dashboard'?drawDashboard():drawTable());document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer()});
    function v(id){return document.getElementById(id).value.trim()}function setState(t,ok){document.getElementById('state').textContent=t;document.querySelector('.dot').style.background=ok?'var(--green)':'var(--gold)'}function formError(t){const e=document.getElementById('error');e.textContent=t;e.style.display='block'}function showFatal(e){document.getElementById('table').innerHTML=`<div class="empty"><b>No se pudo conectar</b><span>${esc(e.message||String(e))}</span></div>`;setState('Error de conexión',false)}function readFile(f){return new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(v){return esc(v)}
    init();
  </script>
</body>
</html>
